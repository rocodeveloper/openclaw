name: Build Fork

on:
  push:
    branches: [rocobot]
  workflow_dispatch:

concurrency:
  group: build-fork-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  BASE_TAG: v2026.9.8
  UPSTREAM_REPO: https://github.com/openclaw/openclaw.git

jobs:
  build:
    if: github.ref == 'refs/heads/rocobot'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Fetch base tag
        run: git fetch --no-tags "$UPSTREAM_REPO" "refs/tags/$BASE_TAG:refs/tags/$BASE_TAG"

      - name: Leak scan
        env:
          FORK_LEAK_TERMS: ${{ secrets.FORK_LEAK_TERMS }}
        run: node scripts/fork-leak-scan.mjs "$BASE_TAG" HEAD

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: "off"

      - name: Typecheck
        run: |
          status=0
          pnpm tsgo:core || status=1
          pnpm tsgo:extensions || status=1
          pnpm tsgo:extensions:test || status=1
          exit "$status"

      - name: Test fork changes
        run: |
          mapfile -t fork_tests < <(git diff --name-only --diff-filter=AM "$BASE_TAG...HEAD" -- '*.test.ts')
          if ((${#fork_tests[@]} > 0)); then
            node scripts/run-vitest.mjs "${fork_tests[@]}"
          fi

      - name: Build and package
        id: package
        run: |
          version="$(node -p 'require("./package.json").version')"
          short_sha="$(git rev-parse --short=12 HEAD)"
          tarball_name="openclaw-${version}-rocobot-${short_sha}.tgz"
          node scripts/package-openclaw-for-docker.mjs \
            --bundle-plugin whatsapp \
            --bundle-plugin discord \
            --bundle-plugin codex \
            --pnpm-pack \
            --allow-unreleased-changelog \
            --output-dir .artifacts/fork-package \
            --output-name "$tarball_name"
          {
            echo "tarball=.artifacts/fork-package/$tarball_name"
            echo "tag=rocobot-${version}-${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-fork
          path: ${{ steps.package.outputs.tarball }}
          retention-days: 30

      - name: Upload rejected package
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-fork-rejected
          path: .artifacts/fork-package/*.tgz
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          {
            echo "Base: \`$BASE_TAG\`"
            echo
            echo "Fork commits:"
            echo
            git log --reverse --format='- %h %s' "$BASE_TAG..HEAD"
          } > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_target="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            if [[ "$release_target" != "$GITHUB_SHA" ]]; then
              echo "Release $RELEASE_TAG targets $release_target, not $GITHUB_SHA." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$TARBALL" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" "$TARBALL" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
